{% extends "base.html" %}

{% block title %}Register - Physio Connect{% endblock %}

{% block content %}
<div class="register-section">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-9">
                <div class="card shadow auth-card">
                    <div class="card-header bg-success text-white text-center">
                        <h4 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>Join Physio Connect
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center gy-4">
                            <div class="col-md-4 text-center">
                                <img src="{{ url_for('static', filename='images/Physio.png') }}"
                                     alt="Physio Connect" width="110" height="110" class="register-form-logo">
                            </div>
                            <div class="col-md-8">
                                <form method="POST" novalidate>
                                    <input type="hidden" name="step" value="1">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">
                                            <i class="fas fa-user me-1"></i>Full Name
                                        </label>
                                        <input type="text" class="form-control" id="name" name="name" required
                                               placeholder="Enter your full name" data-bs-toggle="tooltip" title="Enter your complete name">
                                        <div class="invalid-feedback">
                                            Please provide your full name.
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">
                                            <i class="fas fa-envelope me-1"></i>Email Address
                                        </label>
                                        <input type="email" class="form-control" id="email" name="email" required
                                               placeholder="Enter your email address" data-bs-toggle="tooltip" title="We'll send confirmation to this email">
                                        <div class="invalid-feedback">
                                            Please provide a valid email address.
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="password" class="form-label">
                                            <i class="fas fa-lock me-1"></i>Password
                                        </label>
                                        <input type="password" class="form-control" id="password" name="password" required
                                               placeholder="Create a strong password" minlength="6" data-bs-toggle="tooltip" title="Minimum 6 characters">
                                        <div class="invalid-feedback">
                                            Password must be at least 6 characters long.
                                        </div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success btn-lg" name="role" value="patient">
                                            <i class="fas fa-envelope me-2"></i>Register as a patient
                                        </button>
                                        <button type="submit" class="btn btn-success" name="role" value="physiotherapist">
                                            <i class="fas fa-user-md me-2"></i>Register yourself as a doctor
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <p class="mb-0">Already have an account?
                            <a href="/login" class="text-success fw-bold" data-bs-toggle="tooltip" title="Sign in to existing account">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
